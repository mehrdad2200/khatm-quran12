<!-- بسم‌الله آغاز برنامه: محو می‌شود و برنامه باز می‌شود -->
<div id="splash" aria-hidden="true"><div class="spl"><i class="cal glyph" style="-webkit-mask-image:url(img/bismillah.png);mask-image:url(img/bismillah.png);aspect-ratio:658/491"></i><p>به نام خداوند بخشنده مهربان</p></div></div>
<!-- افکت خروج -->
<div id="byebye" hidden><div class="spl"><p>برنامه بسته شد. می‌توانید این صفحه را ببندید.</p><button class="btn g" onclick="location.reload()">بازگشت به برنامه</button></div></div>
<div id="exitov" hidden><div class="spl"><i class="cal glyph" style="-webkit-mask-image:url(img/faraj.png);mask-image:url(img/faraj.png);aspect-ratio:620/262"></i><p>اللهم عجل لولیک الفرج</p></div></div>

<script>
/* نگهبان راه‌اندازی: فقط وقتی واقعاً خطا رخ داده باشد (نه کندی اینترنت) حافظهٔ کد قدیمی را پاک می‌کند؛ اطلاعات کاربر دست‌نخورده می‌ماند */
window.addEventListener("error",function(e){window.__err=(e.message||"")+" @"+String(e.filename||"").split("/").pop()+":"+(e.lineno||"")});
async function fixApp(){try{var r=await navigator.serviceWorker.getRegistrations();r.forEach(function(x){x.unregister()});var k=await caches.keys();await Promise.all(k.filter(function(x){return/^khatm-v\d/.test(x)}).map(function(x){return caches.delete(x)}))}catch(e){}location.reload()}
function showRec(slow){if(document.getElementById("recov"))return;var d=document.createElement("div");d.id="recov";d.setAttribute("style","position:fixed;inset:0;z-index:99999;background:#06130f;color:#f3ead0;display:grid;place-items:center;text-align:center;padding:24px;font:16px/2 Tahoma,sans-serif");d.innerHTML=slow?'<div><p>بارگذاری طول کشیده است؛ احتمالاً اینترنت کند است.</p><p style="opacity:.7;font-size:13px">بار اول حدود ۳ مگابایت دانلود می‌شود و بعد از آن همیشه روی گوشی می‌ماند.</p><button style="margin-top:12px;padding:12px 22px;border-radius:14px;border:0;background:#d8b45c;color:#2b2410;font:700 16px Tahoma" onclick="location.reload()">تلاش دوباره</button></div>':'<div><p>برنامه درست بالا نیامد.</p><p style="opacity:.7;font-size:13px;direction:ltr">'+(window.__err||"")+'</p><button style="margin-top:12px;padding:12px 22px;border-radius:14px;border:0;background:#d8b45c;color:#2b2410;font:700 16px Tahoma" onclick="fixApp()">رفع مشکل و راه‌اندازی دوباره</button><p style="opacity:.6;font-size:12px">اطلاعات و پیشرفت شما پاک نمی‌شود.</p></div>';document.body.appendChild(d)}
window.addEventListener("load",function(){setTimeout(function(){if(window.__ok)return;if(!window.__err){setTimeout(function(){if(!window.__ok)showRec(1)},20000);return}try{if(!sessionStorage.getItem("khatm-fix")){sessionStorage.setItem("khatm-fix","1");fixApp();return}}catch(e){}showRec()},5000)});
setTimeout(function(){if(window.__ok)return;var p=document.querySelector("#splash .spl p");if(p){p.style.opacity=1;p.style.animation="none";p.textContent="در حال بارگذاری بار اول (فقط یک‌بار)…"}},4000);
setTimeout(function(){if(!window.__ok&&!window.__err)showRec(1)},90000);
</script>
